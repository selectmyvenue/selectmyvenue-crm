<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set New Password | Select My Venue CRM</title>
  <link rel="stylesheet" href="auth-pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="auth-page"><section class="auth-card">
  <img class="auth-logo" src="logo.png" alt="Select My Venue">
  <h1>Create a new password</h1>
  <p class="auth-sub">Use the secure recovery link from your email to set a new Staff CRM password.</p>
  <div id="status" class="auth-status">Verifying your secure recovery link…</div>
  <form id="resetForm" class="auth-form hidden" autocomplete="off">
    <div class="auth-field"><label for="newPassword">NEW PASSWORD</label><input id="newPassword" type="password" autocomplete="new-password" required></div>
    <div class="auth-field"><label for="confirmPassword">CONFIRM NEW PASSWORD</label><input id="confirmPassword" type="password" autocomplete="new-password" required></div>
    <div class="auth-rule">Use at least 8 characters with an uppercase letter, lowercase letter and number.</div>
    <button id="resetBtn" class="auth-button" type="submit">Save New Password</button>
    <div id="message" class="auth-message" role="alert" aria-live="polite"></div>
  </form>
  <a class="auth-back" href="forgot-password.html">Request a new reset link</a>
  <div class="auth-note">Select My Venue · Secure Employee CRM</div>
</section></main>
<script>
const client=window.supabase.createClient(
  "https://uajqwyoqbbswkfiwosyw.supabase.co",
  "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7",
  {auth:{storageKey:"smv-master-crm-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);
const statusBox=document.getElementById("status");const form=document.getElementById("resetForm");const btn=document.getElementById("resetBtn");const msg=document.getElementById("message");let ready=false;let eventSeen=false;
function show(text,type=""){msg.textContent=text;msg.className="auth-message "+type}
function setStatus(text,type=""){statusBox.textContent=text;statusBox.className="auth-status "+type}
function enable(){if(ready)return;ready=true;setStatus("Recovery link verified. You can now create a new password.","good");form.classList.remove("hidden");history.replaceState({},document.title,"reset-password.html")}
function marker(){const query=new URLSearchParams(location.search);const hash=new URLSearchParams((location.hash||"").replace(/^#/,""));return query.get("type")==="recovery"||hash.get("type")==="recovery"||query.has("token_hash")||query.has("code")||hash.has("access_token")}
const arrived=marker();
client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session){eventSeen=true;enable()}});
(async()=>{if(!arrived){setStatus("This page must be opened from a valid password-recovery email link.","bad");return}for(let i=0;i<12;i++){await new Promise(resolve=>setTimeout(resolve,250));const{data,error}=await client.auth.getSession();if(!error&&data?.session){enable();return}}if(!eventSeen)setStatus("This recovery link is invalid or has expired. Please request a new reset link.","bad")})();
const strong=value=>value.length>=8&&/[a-z]/.test(value)&&/[A-Z]/.test(value)&&/\d/.test(value);
form.addEventListener("submit",async event=>{event.preventDefault();const password=document.getElementById("newPassword").value;const confirm=document.getElementById("confirmPassword").value;if(!ready){show("Your recovery link has not been verified.","error");return}if(!strong(password)){show("Password must be at least 8 characters and include uppercase, lowercase and a number.","error");return}if(password!==confirm){show("The two passwords do not match.","error");return}btn.disabled=true;btn.textContent="Saving…";show("");try{const{error}=await client.auth.updateUser({password});if(error){show(error.message||"Unable to update your password.","error");return}show("Password updated successfully. Returning to login…","success");await client.auth.signOut({scope:"local"});setTimeout(()=>location.replace("login.html?reset=success"),700)}catch(error){console.error(error);show("Unable to update your password. Please try again.","error")}finally{btn.disabled=false;btn.textContent="Save New Password"}});
</script>
</body></html>
