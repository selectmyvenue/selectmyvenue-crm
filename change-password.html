<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Change Password | Select My Venue CRM</title>
  <link rel="stylesheet" href="auth-pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="auth-page"><section class="auth-card">
  <img class="auth-logo" src="https://selectmyvenue.com/logo.png" alt="Select My Venue">
  <h1>Change password</h1>
  <p class="auth-sub">Confirm your current password before creating a new Staff CRM password.</p>
  <div id="status" class="auth-status">Checking your Staff CRM session…</div>
  <form id="changeForm" class="auth-form hidden" autocomplete="off">
    <div class="auth-field"><label for="currentPassword">CURRENT PASSWORD</label><input id="currentPassword" type="password" autocomplete="current-password" required></div>
    <div class="auth-field"><label for="newPassword">NEW PASSWORD</label><input id="newPassword" type="password" autocomplete="new-password" required></div>
    <div class="auth-field"><label for="confirmPassword">CONFIRM NEW PASSWORD</label><input id="confirmPassword" type="password" autocomplete="new-password" required></div>
    <div class="auth-rule">Use at least 8 characters with an uppercase letter, lowercase letter and number.</div>
    <button id="changeBtn" class="auth-button" type="submit">Update Password</button>
    <div id="message" class="auth-message" role="alert" aria-live="polite"></div>
  </form>
  <a class="auth-back" href="dashboard.html">← Back to CRM Dashboard</a>
  <div class="auth-note">Select My Venue · Secure Employee CRM</div>
</section></main>
<script>
const client=window.supabase.createClient(
  "https://uajqwyoqbbswkfiwosyw.supabase.co",
  "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7",
  {auth:{storageKey:"smv-master-crm-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);
const statusBox=document.getElementById("status");const form=document.getElementById("changeForm");const btn=document.getElementById("changeBtn");const msg=document.getElementById("message");let user=null;
const show=(text,type="")=>{msg.textContent=text;msg.className="auth-message "+type};
const strong=value=>value.length>=8&&/[a-z]/.test(value)&&/[A-Z]/.test(value)&&/\d/.test(value);
(async()=>{const{data}=await client.auth.getSession();if(!data?.session){location.replace("login.html");return}user=data.session.user;const{data:allowed,error}=await client.rpc("smv_is_active_staff");if(error||!(allowed===true||allowed==="true"||allowed===1||allowed==="1")){await client.auth.signOut({scope:"local"});location.replace("login.html");return}statusBox.textContent="Staff account verified. Enter your current password to continue.";statusBox.className="auth-status good";form.classList.remove("hidden")})();
form.addEventListener("submit",async event=>{event.preventDefault();const current=document.getElementById("currentPassword").value;const password=document.getElementById("newPassword").value;const confirm=document.getElementById("confirmPassword").value;if(password===current){show("Your new password must be different from the current password.","error");return}if(!strong(password)){show("New password must be at least 8 characters and include uppercase, lowercase and a number.","error");return}if(password!==confirm){show("The new passwords do not match.","error");return}btn.disabled=true;btn.textContent="Updating…";show("");try{const{error:reauthError}=await client.auth.signInWithPassword({email:user.email,password:current});if(reauthError){show("Current password is incorrect.","error");return}const{error}=await client.auth.updateUser({password});if(error){show(error.message||"Unable to update your password.","error");return}show("Password changed successfully. You will be signed out now.","success");await client.auth.signOut({scope:"local"});setTimeout(()=>location.replace("login.html?reset=success"),900)}catch(error){console.error(error);show("Unable to update your password.","error")}finally{btn.disabled=false;btn.textContent="Update Password"}});
</script>
</body></html>
