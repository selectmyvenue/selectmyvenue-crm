name: One-time CRM customer comment visibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-customer-comment-crm-fix.yml'

permissions:
  contents: write

jobs:
  fix-crm-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CRM customer comment fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          def save(path, text, original):
              if text != original:
                  Path(path).write_text(text, encoding='utf-8')
                  changed.append(path)

          path = 'crm-core.js'
          original = Path(path).read_text(encoding='utf-8')
          text = original

          # Customer-submitted website comments live in contact_remark.
          # Staff comments remain in internal_notes. Show staff note first when present,
          # otherwise fall back to the customer comment so the CRM Comment column works.
          text = re.sub(
              r'safeValue\(\s*lead\.internal_notes\s*\)',
              'safeValue(lead.internal_notes || lead.contact_remark)',
              text
          )

          # Make CRM search find customer comments as well.
          search_old = '''                    lead.requirements,\n                    lead.internal_notes,\n                    lead.status'''
          search_new = '''                    lead.requirements,\n                    lead.contact_remark,\n                    lead.internal_notes,\n                    lead.status'''
          if search_old in text:
              text = text.replace(search_old, search_new, 1)

          # Detail panel should also show the same effective comment when no staff note exists.
          text = text.replace(
              '''        lead.internal_notes ||\n        \"\"''',
              '''        lead.internal_notes ||\n        lead.contact_remark ||\n        \"\"'''
          )

          save(path, text, original)

          # Force browser to load the updated CRM core immediately.
          path = 'crm.js'
          original = Path(path).read_text(encoding='utf-8')
          text = re.sub(r'crm-core\.js\?v=[^\"\']+', 'crm-core.js?v=20260909-customer-comment-1', original)
          save(path, text, original)

          core = Path('crm-core.js').read_text(encoding='utf-8')
          loader = Path('crm.js').read_text(encoding='utf-8')
          if 'lead.internal_notes || lead.contact_remark' not in core:
              raise SystemExit('CRM comment fallback guardrail failed')
          if 'lead.contact_remark,' not in core:
              raise SystemExit('CRM comment search guardrail failed')
          if 'crm-core.js?v=20260909-customer-comment-1' not in loader:
              raise SystemExit('CRM cache-bust guardrail failed')

          print('Changed files:')
          for item in sorted(set(changed)):
              print(' -', item)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Select My Venue Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Show website customer comments in CRM"
          git push origin HEAD:main
