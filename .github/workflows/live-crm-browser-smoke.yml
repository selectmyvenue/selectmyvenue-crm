name: Live CRM browser smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'
  pull_request:
    paths:
      - 'tests/browser-smoke.mjs'
      - 'tests/employee-ui.cjs'
      - 'tests/master-workspace.cjs'
      - 'tests/ai-venue-discovery.cjs'
      - 'ai-venue-discovery.js'
      - 'ai-venue-discovery.css'
      - 'dashboard.html'
      - 'package.json'
      - 'tests/automation-audit.cjs'
      - 'tests/business-os.cjs'
      - 'tests/business-intelligence.cjs'
      - 'tests/customer-360.cjs'
      - 'tests/growth-quality-centre.cjs'
      - 'tests/live-operations.cjs'
      - 'tests/partner-response-centre.cjs'
      - 'tests/smart-match-desk.cjs'
      - 'tests/venue-trust-centre.cjs'
      - 'smv-customer-360.js'
      - 'smv-customer-360.css'
      - 'smv-growth-quality-centre.js'
      - 'smv-growth-quality-centre.css'
      - 'smv-live-operations.js'
      - 'smv-live-operations.css'
      - 'smv-partner-response-centre.js'
      - 'smv-partner-response-centre.css'
      - 'smv-smart-match-desk.js'
      - 'smv-smart-match-desk.css'
      - 'smv-venue-trust-centre.js'
      - 'smv-venue-trust-centre.css'
      - 'tests/partner-availability-v2.cjs'
      - 'smv-business-os.js'
      - 'smv-business-os.css'
      - 'smv-business-intelligence.js'
      - 'smv-business-intelligence.css'
      - 'crm-enhancements.js'
      - '.github/workflows/live-crm-browser-smoke.yml'

permissions:
  contents: read

concurrency:
  group: live-crm-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install regression test dependency
        run: npm install --no-save jsdom@26.1.0
      - name: Run Master CRM and employee regression tests
        run: npm test
      - name: Install Playwright
        run: |
          npm install --no-save playwright jsdom@26.1.0
          npx playwright install --with-deps chromium
      - name: Test live CRM login pages on mobile and desktop
        run: node tests/browser-smoke.mjs
