name: HR Portal Regression Checks

on:
  pull_request:
    paths:
      - 'hr/**'
      - 'supabase/migrations/*hr_portal.sql'
      - 'tests/hr-portal.cjs'
      - 'dashboard.html'
      - 'package.json'
      - '.github/workflows/hr-portal-tests.yml'
  push:
    branches:
      - feature/master-hr-portal
    paths:
      - 'hr/**'
      - 'supabase/migrations/*hr_portal.sql'
      - 'tests/hr-portal.cjs'
      - 'dashboard.html'
      - 'package.json'
      - '.github/workflows/hr-portal-tests.yml'

jobs:
  hr-portal-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run CRM and HR regression tests
        run: npm test
