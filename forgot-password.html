<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Forgot Password | Select My Venue CRM</title>
  <link rel="stylesheet" href="auth-pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="auth-page"><section class="auth-card">
  <img class="auth-logo" src="https://selectmyvenue.com/logo.png" alt="Select My Venue">
  <h1>Reset your password</h1>
  <p class="auth-sub">Enter the email used for your authorised Staff CRM account. We’ll email you a secure recovery link.</p>
  <form id="forgotForm" class="auth-form">
    <div class="auth-field"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" placeholder="Enter your email" required></div>
    <button id="sendBtn" class="auth-button" type="submit">Send Reset Link</button>
    <div id="message" class="auth-message" role="alert" aria-live="polite"></div>
  </form>
  <a class="auth-back" href="login.html">← Back to Staff Login</a>
  <div class="auth-note">Select My Venue · Secure Employee CRM</div>
</section></main>
<script>
const client=window.supabase.createClient(
  "https://uajqwyoqbbswkfiwosyw.supabase.co",
  "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7",
  {auth:{storageKey:"smv-master-crm-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);
const form=document.getElementById("forgotForm");
const btn=document.getElementById("sendBtn");
const msg=document.getElementById("message");
function show(text,type=""){msg.textContent=text;msg.className="auth-message "+type}
form.addEventListener("submit",async event=>{
  event.preventDefault();
  const email=document.getElementById("email").value.trim();
  if(!email)return;
  btn.disabled=true;btn.textContent="Sending…";show("");
  try{
    const{error}=await client.auth.resetPasswordForEmail(email,{redirectTo:"https://crm.selectmyvenue.com/reset-password.html"});
    if(error){
      if(/rate|too many/i.test(String(error.message||""))){show("Too many reset requests. Please wait a few minutes and try again.","error")}
      else{show("Unable to send the reset email right now. Please try again.","error")}
      return;
    }
    show("If this email is registered, a secure password-reset link has been sent. Please check your inbox and spam folder.","success");
    form.reset();
  }catch(error){console.error(error);show("Unable to send the reset email right now. Please try again.","error")}
  finally{btn.disabled=false;btn.textContent="Send Reset Link"}
});
</script>
</body></html>
