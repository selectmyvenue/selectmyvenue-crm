<script

<style>

    /* =====================================================
       FULL SCREEN CORPORATE CRM LOGIN
    ===================================================== */

    * {
        box-sizing: border-box;
    }

    html {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100vh;

        margin: 0;
        padding: 0;

        overflow-x: hidden;

        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif;

        background:
            #071018;

        color: #ffffff;
    }


    /* =====================================================
       FULL VIEWPORT BACKGROUND
    ===================================================== */

    .login-page {

        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;
        height: 100dvh;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 40px;

        overflow-y: auto;
        overflow-x: hidden;

        background:

            radial-gradient(
                circle at 50% 35%,
                rgba(21, 154, 140, 0.14),
                transparent 35%
            ),

            radial-gradient(
                circle at 15% 90%,
                rgba(21, 154, 140, 0.08),
                transparent 35%
            ),

            radial-gradient(
                circle at 85% 10%,
                rgba(255, 190, 70, 0.035),
                transparent 30%
            ),

            linear-gradient(
                135deg,
                #050b12 0%,
                #09131d 48%,
                #050b12 100%
            );

    }


    /* =====================================================
       CORPORATE BACKGROUND GRID
    ===================================================== */

    .login-page::before {

        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        opacity: 0.18;

        background-image:

            linear-gradient(
                rgba(255,255,255,0.025) 1px,
                transparent 1px
            ),

            linear-gradient(
                90deg,
                rgba(255,255,255,0.025) 1px,
                transparent 1px
            );

        background-size:
            60px 60px;

    }


    /* =====================================================
       SOFT CENTER LIGHT
    ===================================================== */

    .login-page::after {

        content: "";

        position: absolute;

        width: 700px;
        height: 700px;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(21,154,140,0.08) 0%,
                rgba(21,154,140,0.025) 40%,
                transparent 72%
            );

        pointer-events: none;

    }


    /* =====================================================
       LOGIN CARD
    ===================================================== */

    .login-card {

        position: relative;

        z-index: 5;

        width: 440px;
        max-width: 100%;

        padding:
            46px
            44px
            34px;

        border-radius: 26px;

        background:

            linear-gradient(
                145deg,
                rgba(18, 30, 44, 0.97),
                rgba(8, 17, 27, 0.98)
            );

        border:
            1px solid
            rgba(255,255,255,0.10);

        box-shadow:

            0 40px 100px
            rgba(0,0,0,0.60),

            0 0 80px
            rgba(21,154,140,0.08);

        backdrop-filter:
            blur(18px);

        -webkit-backdrop-filter:
            blur(18px);

    }


    /* =====================================================
       LOGO
    ===================================================== */

    .login-logo {

        display: block;

        width: 150px;
        height: 150px;

        object-fit: contain;

        margin:
            0 auto 26px;

        border-radius: 24px;

        filter:
            drop-shadow(
                0 12px 25px
                rgba(0,0,0,0.35)
            );

    }


    /* =====================================================
       BRAND
    ===================================================== */

    .login-brand {

        text-align: center;

        margin-bottom: 32px;

    }


    .login-brand h1 {

        margin: 0;

        font-size: 27px;

        line-height: 1.2;

        font-weight: 750;

        letter-spacing:
            -0.5px;

        color: #ffffff;

    }


    .login-brand p {

        margin:
            10px 0 0;

        font-size: 13px;

        line-height: 1.5;

        color:
            rgba(255,255,255,0.55);

        letter-spacing:
            0.2px;

    }


    /* =====================================================
       FORM
    ===================================================== */

    .login-form {

        display: grid;

        gap: 19px;

    }


    .login-field {

        display: grid;

        gap: 8px;

    }


    .login-field label {

        font-size: 11px;

        font-weight: 750;

        letter-spacing:
            0.10em;

        color:
            rgba(255,255,255,0.68);

    }


    .login-field input {

        width: 100%;

        height: 50px;

        padding:
            0 15px;

        border-radius: 12px;

        border:
            1px solid
            rgba(255,255,255,0.11);

        background:
            rgba(255,255,255,0.045);

        color: #ffffff;

        outline: none;

        font-size: 15px;

        transition:
            0.2s ease;

    }


    .login-field input::placeholder {

        color:
            rgba(255,255,255,0.30);

    }


    .login-field input:hover {

        border-color:
            rgba(255,255,255,0.18);

    }


    .login-field input:focus {

        border-color:
            rgba(21,154,140,0.85);

        background:
            rgba(255,255,255,0.06);

        box-shadow:

            0 0 0 3px
            rgba(21,154,140,0.10);

    }


    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    .login-btn {

        width: 100%;

        height: 50px;

        margin-top: 3px;

        border: 0;

        border-radius: 12px;

        cursor: pointer;

        font-size: 15px;

        font-weight: 750;

        color: #ffffff;

        background:

            linear-gradient(
                135deg,
                #18a997,
                #087f73
            );

        box-shadow:

            0 10px 28px
            rgba(8,127,115,0.25);

        transition:
            0.2s ease;

    }


    .login-btn:hover {

        transform:
            translateY(-1px);

        box-shadow:

            0 14px 32px
            rgba(8,127,115,0.35);

    }


    .login-btn:active {

        transform:
            translateY(0);

    }


    .login-btn:disabled {

        opacity: 0.55;

        cursor:
            not-allowed;

        transform:
            none;

    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    .login-message {

        min-height: 20px;

        margin-top: 1px;

        text-align: center;

        font-size: 13px;

        line-height: 1.4;

    }


    .login-message.error {

        color:
            #ff8f8f;

    }


    .login-message.success {

        color:
            #63e6be;

    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .login-footer {

        margin-top: 27px;

        padding-top: 20px;

        border-top:
            1px solid
            rgba(255,255,255,0.06);

        text-align: center;

        font-size: 10px;

        letter-spacing:
            0.3px;

        color:
            rgba(255,255,255,0.32);

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

        .login-page {

            padding:
                24px 16px;

        }

        .login-card {

            width: 100%;

            padding:
                36px 25px 28px;

            border-radius:
                22px;

        }

        .login-logo {

            width: 120px;
            height: 120px;

            margin-bottom:
                21px;

        }

        .login-brand h1 {

            font-size:
                23px;

        }

    }


    /* =====================================================
       SMALL HEIGHT SCREENS
    ===================================================== */

    @media (max-height: 700px) {

        .login-page {

            align-items:
                flex-start;

            padding-top:
                25px;

            padding-bottom:
                25px;

        }

        .login-card {

            padding-top:
                30px;

        }

        .login-logo {

            width: 105px;
            height: 105px;

            margin-bottom:
                16px;

        }

        .login-brand {

            margin-bottom:
                22px;

        }

    }

</style>

<script>

    const supabaseLogin =
        window.supabase.createClient(
            window.SUPABASE_URL,
            window.SUPABASE_ANON_KEY
        );


    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const loginBtn =
        document.getElementById(
            "loginBtn"
        );

    const loginMessage =
        document.getElementById(
            "loginMessage"
        );


    function showLoginMessage(
        message,
        type = ""
    ) {

        loginMessage.textContent =
            message;

        loginMessage.className =
            "login-message " + type;

    }


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            if (
                !email ||
                !password
            ) {

                showLoginMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;

            }


            loginBtn.disabled =
                true;

            loginBtn.textContent =
                "Signing in...";

            showLoginMessage("");


            try {

                const result =
                    await supabaseLogin
                        .auth
                        .signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });


                if (
                    result.error
                ) {

                    console.error(
                        "Login error:",
                        result.error
                    );

                    showLoginMessage(
                        result.error.message ||
                        "Invalid email or password.",
                        "error"
                    );

                    return;

                }


               if (
    result.data &&
    result.data.session
) {

    const loggedInUser =
        result.data.session.user;


    const {
        data: profile,
        error: profileError
    } =
        await supabaseLogin
            .from("profiles")
            .select(
                "user_id, role, is_active"
            )
            .eq(
                "user_id",
                loggedInUser.id
            )
            .maybeSingle();


    if (profileError) {

        console.error(
            "CRM profile verification error:",
            profileError
        );

        await supabaseLogin.auth.signOut();

        showLoginMessage(
            "Unable to verify CRM access.",
            "error"
        );

        return;
    }


    const role =
        String(
            profile?.role || ""
        )
            .trim()
            .toLowerCase();


    const allowedRoles = [
        "staff",
        "admin"
    ];


    if (
        !profile ||
        profile.is_active !== true ||
        !allowedRoles.includes(role)
    ) {

        await supabaseLogin.auth.signOut();

        showLoginMessage(
            "This account is not authorized for Employee CRM. Please use Venue Partner CRM.",
            "error"
        );

        return;
    }


    showLoginMessage(
        "Login successful. Opening CRM...",
        "success"
    );


    setTimeout(
        function() {

            window.location.href =
                "./dashboard.html";

        },
        500
    );

}


            } catch (error) {

                console.error(
                    "Login exception:",
                    error
                );

                showLoginMessage(
                    "Unable to connect to Supabase.",
                    "error"
                );

            } finally {

                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "Login to CRM";

            }

        }
    );


    /* =====================================================
       EXISTING SESSION
    ====================================================== */

    (async function checkExistingMasterSession() {

    try {

        const result =
            await supabaseLogin
                .auth
                .getSession();


        const session =
            result?.data?.session;


        if (
            !session ||
            !session.user
        ) {
            return;
        }


        /*
         * Verify that the existing session belongs
         * to an active Master CRM staff/admin user.
         */

        const {
            data: profile,
            error
        } =
            await supabaseLogin
                .from("profiles")
                .select(
                    "user_id, role, is_active"
                )
                .eq(
                    "user_id",
                    session.user.id
                )
                .maybeSingle();


        if (error) {

            console.warn(
                "Master session profile check failed:",
                error
            );

            return;
        }


        const role =
            String(
                profile?.role || ""
            )
                .trim()
                .toLowerCase();


        const allowedRoles = [
            "staff",
            "admin"
        ];


        if (
            profile &&
            profile.is_active === true &&
            allowedRoles.includes(role)
        ) {

            window.location.href =
                "./dashboard.html";

            return;
        }


        /*
         * Existing session belongs to a partner
         * or another non-Master account.
         *
         * Do NOT open Master CRM.
         */

        console.warn(
            "Existing session is not authorized for Master CRM."
        );

        await supabaseLogin.auth.signOut();

    }
    catch (error) {

        console.error(
            "Session check failed:",
            error
        );

    }

})();
</script>
