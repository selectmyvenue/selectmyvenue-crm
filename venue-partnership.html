<body>
<div id="root"><div class="loading">Loading Select My Venue…</div></div>

<script>
(function(){
"use strict";

var root=document.getElementById("root");
var url=new URL(window.location.href);
var venueId=url.searchParams.get("venue");
var supabase=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{
  auth:{storageKey:"smv-master-crm-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

function esc(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function clean(v){return String(v==null?"":v).trim()}
function date(v){
  if(!v)return "—";
  var x=new Date(v);
  return isNaN(x)?"—":x.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}
function money(v){
  if(v===null||v===undefined||v==="")return "";
  var n=Number(v); if(!isFinite(n))return clean(v);
  return "₹"+n.toLocaleString("en-IN");
}
function plan(v){return ({launch_trial:"Launch Trial",partner:"Partner",growth:"Growth",premium:"Premium"})[v]||"Launch Trial"}
function status(v){return String(v||"Active").replace(/[-_]/g," ").replace(/\b\w/g,function(c){return c.toUpperCase()})}
function bool(v,yes,no){return v===true?yes:(v===false?no:"—")}
function list(v){
  if(Array.isArray(v))return v.filter(Boolean).map(clean).filter(Boolean);
  if(typeof v==="string")return v.split(",").map(clean).filter(Boolean);
  return [];
}
function descriptionText(v){
  var raw=clean(v);
  if(!raw)return "";
  var box=document.createElement("div");
  box.innerHTML=raw;
  return (box.textContent||box.innerText||"").replace(/\r/g,"").trim();
}
function paragraphs(v){
  var t=descriptionText(v);
  if(!t)return '<p>Venue description is available on request.</p>';
  return t.split(/\n{2,}/).map(function(x){return "<p>"+esc(x).replace(/\n/g,"<br>")+"</p>"}).join("");
}
function fail(title,msg){
  root.innerHTML='<div class="page"><div class="error-card"><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p></div></div>';
}
function loginScreen(message,type){
  root.innerHTML=
    '<main class="login-page"><section class="login-card">'+
      '<div class="login-logo-wrap"><img class="login-logo" src="https://selectmyvenue.com/logo.png" alt="Select My Venue"></div>'+
      '<div class="login-brand"><h1>Venue Partnership</h1><p>Secure Select My Venue access for venue partnership summaries</p></div>'+
      '<form id="smvPartnershipLogin" class="login-form" autocomplete="on">'+
        '<div class="login-field"><label for="smvLoginEmail">EMAIL ADDRESS</label><input id="smvLoginEmail" type="email" autocomplete="username" placeholder="Enter your email" required></div>'+
        '<div class="login-field"><label for="smvLoginPassword">PASSWORD</label><input id="smvLoginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>'+
        '<div class="login-note">Use your existing Select My Venue CRM credentials. Only authorised active staff can open this page.</div>'+
        '<button id="smvLoginBtn" class="login-btn" type="submit">Continue to Venue Partnership</button>'+
        '<div id="smvLoginMessage" class="login-message '+(type||"")+'">'+esc(message||"")+'</div>'+
      '</form>'+
      '<div class="login-footer">Select My Venue · Secure Partnership Portal</div>'+
    '</section></main>';

  var form=document.getElementById("smvPartnershipLogin");
  if(!form)return;
  form.addEventListener("submit",async function(e){
    e.preventDefault();
    var btn=document.getElementById("smvLoginBtn");
    var msg=document.getElementById("smvLoginMessage");
    var email=clean(document.getElementById("smvLoginEmail").value);
    var password=document.getElementById("smvLoginPassword").value;
    btn.disabled=true;btn.textContent="Signing in...";
    msg.className="login-message";msg.textContent="";
    try{
      var auth=await supabase.auth.signInWithPassword({email:email,password:password});
      if(auth.error)throw auth.error;
      var staff=await supabase.rpc("smv_is_active_staff");
      if(staff.error||staff.data!==true){
        await supabase.auth.signOut();
        throw new Error("This account is not authorised for Select My Venue staff access.");
      }
      msg.className="login-message success";
      msg.textContent="Access verified. Opening partnership summary...";
      await load();
    }catch(err){
      msg.className="login-message error";
      msg.textContent=err&&err.message?err.message:"Unable to sign in. Please try again.";
      btn.disabled=false;btn.textContent="Continue to Venue Partnership";
    }
  });
}
async function isStaff(){
  var s=await supabase.auth.getSession();
  if(!s.data||!s.data.session)return false;
  var r=await supabase.rpc("smv_is_active_staff");
  return !r.error&&r.data===true;
}
function featureItems(v){
  var out=[];
  list(v.facilities).forEach(function(x){out.push(x)});
  if(v.parking_available===true)out.push("Parking");
  if(v.rooms_available===true||Number(v.room_count)>0)out.push((Number(v.room_count)>0?Number(v.room_count)+" ":"")+"Guest Rooms");
  if(v.catering_available===true)out.push("Catering");
  if(v.decoration_available===true)out.push("Decoration");
  if(v.outdoor_indoor)out.push(v.outdoor_indoor);
  if(v.alcohol_allowed===true)out.push("Alcohol Allowed");
  if(v.outside_catering_allowed===true)out.push("Outside Catering");
  return Array.from(new Set(out.map(clean).filter(Boolean))).slice(0,24);
}
function info(label,value,link){
  if(!clean(value))return "";
  return '<div class="info"><span>'+esc(label)+'</span>'+(
    link?'<a href="'+esc(value)+'" target="_blank" rel="noopener">'+esc(link)+'</a>':
    '<strong>'+esc(value)+'</strong>'
  )+'</div>';
}
async function load(){
  if(!venueId){fail("Venue not selected","Please open Partner Overview from Venue Management so a venue is selected.");return}
  if(!(await isStaff())){loginScreen();return}

  var venueResult=await supabase.from("venues").select("*").eq("id",venueId).single();
  if(venueResult.error||!venueResult.data){fail("Venue not found","The selected venue could not be loaded.");return}
  var v=venueResult.data;

  var a=await supabase.from("venue_enquiry_assignments")
    .select("id,enquiry_id,assignment_status,assigned_at,first_viewed_at,first_contacted_at,last_activity_at,site_visit_at,follow_up_at,converted_at,created_at,customer_enquiries(id,customer_name,mobile,email,location,occasion,event_date,guests,status,created_at)")
    .eq("venue_id",venueId).order("assigned_at",{ascending:false});
  if(a.error){fail("Unable to load leads",a.error.message);return}

  var rows=a.data||[];
  var active=rows.filter(function(x){return String(x.assignment_status||"").toLowerCase()!=="cancelled"});
  var booked=active.filter(function(x){return ["booked","converted"].includes(String(x.customer_enquiries&&x.customer_enquiries.status||"").toLowerCase())||x.converted_at}).length;
  var site=active.filter(function(x){return x.site_visit_at||String(x.customer_enquiries&&x.customer_enquiries.status||"").toLowerCase()==="site-visit"}).length;
  var contacted=active.filter(function(x){return x.first_contacted_at}).length;
  var latest=active[0]&&active[0].assigned_at;
  var features=featureItems(v);
  var address=[v.address,v.area,v.city,v.state,v.pincode].filter(Boolean).join(", ");
  var price=(v.price_min!=null&&v.price_max!=null)?money(v.price_min)+" – "+money(v.price_max)+" / person":(v.price_min!=null?money(v.price_min)+"+ / person":"On request");
  var cap=v.capacity_min&&v.capacity_max?(v.capacity_min+" – "+v.capacity_max+" guests"):(v.capacity_max?("Up to "+v.capacity_max+" guests"):(v.capacity_min?("From "+v.capacity_min+" guests"):"On file"));
  var eventTypes=list(v.event_types);
  var image=clean(v.cover_image_url);
  var website=clean(v.website_url);
  var instagram=clean(v.instagram_url);
  var map=clean(v.google_maps_url);

  root.innerHTML=
  '<div class="page">'+
    '<header class="topbar">'+
      '<div class="brand"><img src="https://selectmyvenue.com/logo.png" alt="Select My Venue"><div class="brand-copy"><b>Venue Partnership</b><small>Secure partnership summary</small></div></div>'+
      '<div class="top-actions"><button class="top-btn" type="button" onclick="window.print()">Print / Save PDF</button><button class="top-btn primary" type="button" id="smvLogout">Sign out</button></div>'+
    '</header>'+

    '<section class="hero">'+
      '<div class="hero-copy"><div class="kicker">VENUE PARTNERSHIP</div><h1>'+esc(v.venue_name||"Venue Partner")+'</h1><p class="hero-sub">'+esc(address||"Delhi NCR venue partner")+'</p>'+
        '<div class="chips"><span class="chip">'+esc(v.venue_type||"Venue")+'</span><span class="chip">'+esc(cap)+'</span><span class="chip">'+esc(price)+'</span><span class="chip">'+esc(status(v.verification_status||"Verified"))+'</span></div>'+
      '</div>'+
      '<div class="hero-image">'+(image?'<img src="'+esc(image)+'" alt="'+esc(v.venue_name||"Venue")+' cover image" onerror="this.style.display=\'none\';this.parentElement.querySelector(\'.hero-fallback\').style.display=\'grid\';">':'')+'<div class="hero-fallback hero-no-image" style="'+(image?'display:none':'')+'">SMV</div></div>'+
    '</section>'+

    '<div class="section-grid">'+
      '<section class="card"><div class="card-pad"><h2 class="card-title">Partnership Snapshot</h2><p class="card-sub">Current Select My Venue partnership and customer enquiry performance.</p>'+
        '<div class="metrics">'+
          '<div class="metric"><span>CURRENT PLAN</span><strong>'+esc(plan(v.partner_plan))+'</strong><small>'+esc(status(v.plan_status))+'</small></div>'+
          '<div class="metric"><span>VALID UNTIL</span><strong>'+esc(date(v.plan_expires_at))+'</strong><small>Start '+esc(date(v.plan_started_at))+'</small></div>'+
          '<div class="metric"><span>LEADS RECEIVED</span><strong>'+active.length+'</strong><small>Assigned to this venue</small></div>'+
          '<div class="metric"><span>BOOKED / CONVERTED</span><strong>'+booked+'</strong><small>'+site+' site visit'+(site===1?"":"s")+'</small></div>'+
        '</div>'+
      '</div></section>'+
      '<section class="card"><div class="card-pad"><h2 class="card-title">Lead Journey</h2><p class="card-sub">Simple view of customer enquiries received by this venue.</p>'+
        '<div class="info-grid">'+
          info("CUSTOMERS CONTACTED",String(contacted))+
          info("SITE VISITS",String(site))+
          info("BOOKED / CONVERTED",String(booked))+
          info("LATEST ENQUIRY",latest?date(latest):"No enquiries yet")+
        '</div>'+
      '</div></section>'+
    '</div>'+

    '<div class="profile-grid">'+
      '<section class="card"><div class="card-pad"><h2 class="card-title">Venue Profile</h2><p class="card-sub">Key venue information currently held by Select My Venue.</p>'+
        '<div class="info-grid">'+
          info("VENUE TYPE",v.venue_type)+
          info("CAPACITY",cap)+
          info("PRICE RANGE",price)+
          info("AREA / CITY",[v.area,v.city].filter(Boolean).join(", "))+
          info("ROOMS",Number(v.room_count)>0?String(v.room_count)+" rooms":bool(v.rooms_available,"Available","Not listed"))+
          info("PARKING",bool(v.parking_available,"Available","Not listed"))+
          info("VEG FOOD",bool(v.food_veg,"Available","Not listed"))+
          info("NON-VEG FOOD",bool(v.food_non_veg,"Available","Not listed"))+
          info("CATERING",bool(v.catering_available,"Available","Not listed"))+
          info("DECORATION",bool(v.decoration_available,"Available","Not listed"))+
          info("PUBLIC LISTING",bool(v.public_listing_enabled,"Enabled","Not enabled"))+
          info("VERIFICATION",status(v.verification_status||"Verified"))+
        '</div>'+
        '<div class="link-row">'+
          (map?'<a class="link-btn primary" href="'+esc(map)+'" target="_blank" rel="noopener">Open Location</a>':"")+
          (website?'<a class="link-btn" href="'+esc(website)+'" target="_blank" rel="noopener">Website</a>':"")+
          (instagram?'<a class="link-btn" href="'+esc(instagram)+'" target="_blank" rel="noopener">Instagram</a>':"")+
        '</div>'+
      '</div></section>'+

      '<section class="card"><div class="card-pad"><h2 class="card-title">Venue Highlights</h2><p class="card-sub">Facilities and event categories recorded for this venue.</p>'+
        (eventTypes.length?'<div class="feature-list">'+eventTypes.map(function(x){return '<span class="feature">'+esc(x)+'</span>'}).join("")+'</div>':"")+
        (features.length?'<div class="feature-list">'+features.map(function(x){return '<span class="feature">'+esc(x)+'</span>'}).join("")+'</div>':'<div class="empty">No additional facilities have been added yet.</div>')+
        (clean(v.description)?'<div style="height:1px;background:#e5efeb;margin:15px 0"></div><div class="description">'+paragraphs(v.description)+'</div>':"")+
      '</div></section>'+
    '</div>'+

    '<section class="card table-card"><div class="table-head"><div><h2 class="card-title">Customer Enquiries Shared</h2><div class="card-sub" style="margin:4px 0 0">Only enquiries assigned to this venue are shown.</div></div><div class="right-note">'+active.length+' enquiry'+(active.length===1?"":"ies")+' received</div></div>'+
      '<div class="table-wrap"><table class="table"><thead><tr><th>CUSTOMER</th><th>CONTACT</th><th>EVENT</th><th>EVENT DATE</th><th>GUESTS</th><th>LOCATION</th><th>STATUS</th><th>RECEIVED</th></tr></thead><tbody>'+
      (active.length?active.map(function(item){
        var e=item.customer_enquiries||{};
        return '<tr><td><strong>'+esc(e.customer_name||"Customer")+'</strong></td>'+
          '<td>'+esc(e.mobile||"—")+(e.email?'<br><span class="muted">'+esc(e.email)+'</span>':"")+'</td>'+
          '<td>'+esc(e.occasion||"—")+'</td><td>'+esc(date(e.event_date))+'</td><td>'+esc(e.guests||"—")+'</td>'+
          '<td>'+esc(e.location||"—")+'</td><td><span class="status">'+esc(status(e.status||item.assignment_status))+'</span></td>'+
          '<td>'+esc(date(item.assigned_at||item.created_at))+'</td></tr>';
      }).join(""):'<tr><td colspan="8" class="empty">No customer enquiries have been assigned to this venue yet.</td></tr>')+
      '</tbody></table></div>'+
    '</section>'+

    '<div class="note"><strong>Select My Venue</strong> shares customer enquiries with verified venue partners based on customer requirements. This summary is designed to show the venue partnership, venue profile and enquiries relevant to this venue only. Internal matching scores, employee notes and other venues are not shown.</div>'+
  '</div>';

  var logout=document.getElementById("smvLogout");
  if(logout)logout.onclick=async function(){await supabase.auth.signOut();loginScreen("Signed out. Please sign in again.","success")};
}

if(!venueId){fail("Venue not selected","Please open Partner Overview from Venue Management so a venue is selected.");return;}
isStaff().then(function(ok){if(ok)load();else loginScreen();}).catch(function(){loginScreen();});
})();
</script>
</body>
</html>
