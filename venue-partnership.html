<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Select My Venue — Venue Partnership</title>
<script>
window.SUPABASE_URL="https://uajqwyoqbbswkfiwosyw.supabase.co";
window.SUPABASE_ANON_KEY="sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f6;color:#173f38;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 28px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;border-radius:12px;background:#087f6c;color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px}.brand b{font-size:16px;letter-spacing:.02em}.brand small{display:block;color:#718b85;font-size:10px;margin-top:2px}
.print{border:1px solid #cfe3dc;background:#fff;color:#245c52;border-radius:10px;padding:9px 13px;font-size:11px;font-weight:850;cursor:pointer}
.hero{background:linear-gradient(135deg,#073f37,#0b806b);color:#fff;border-radius:22px;padding:28px 30px;box-shadow:0 18px 50px rgba(0,65,55,.16);display:flex;justify-content:space-between;gap:24px;align-items:flex-end}
.kicker{font-size:9px;font-weight:900;letter-spacing:.16em;opacity:.72}.hero h1{font-size:30px;line-height:1.1;margin:7px 0 7px}.hero p{margin:0;color:rgba(255,255,255,.78);font-size:13px}.venue-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{padding:7px 10px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);font-size:10px;font-weight:800}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dcebe6;border-radius:18px;box-shadow:0 8px 28px rgba(0,65,55,.06);padding:20px}.card h2{font-size:16px;margin:0 0 4px}.sub{font-size:11px;color:#718b85;margin-bottom:15px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7fbfa;border:1px solid #e1efeb;border-radius:12px;padding:12px}.metric span{display:block;font-size:8px;font-weight:900;letter-spacing:.1em;color:#78918b}.metric strong{display:block;font-size:14px;margin-top:4px;color:#173f38}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:#f7fbfa;border:1px solid #e1efeb;border-radius:12px;padding:14px}.kpi strong{display:block;font-size:22px}.kpi span{font-size:9px;color:#78918b;font-weight:800}
.table-card{margin-top:16px;padding:0;overflow:hidden}.table-head{padding:19px 20px;border-bottom:1px solid #e4efec}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{background:#f7fbfa;padding:11px 14px;text-align:left;font-size:8px;letter-spacing:.1em;color:#78918b;white-space:nowrap}.table td{padding:13px 14px;border-top:1px solid #edf3f1;font-size:11px;vertical-align:top}.table td strong{font-size:12px;color:#173f38}.muted{color:#718b85}.status{display:inline-flex;border-radius:999px;padding:5px 8px;background:#edf8f4;color:#08745d;font-size:9px;font-weight:900;white-space:nowrap}.empty{padding:42px 20px;text-align:center;color:#718b85;font-size:12px}
.note{margin-top:16px;padding:14px 16px;border-radius:13px;background:#eef8f5;border:1px solid #d2eae3;color:#48665f;font-size:11px}.note strong{color:#173f38}
.loading{min-height:55vh;display:grid;place-items:center;color:#718b85;font-size:13px}.error{max-width:560px;margin:80px auto;background:#fff;border:1px solid #f0c7c3;border-radius:18px;padding:24px;text-align:center}.error h2{margin:0 0 8px;color:#8f241b}.error p{font-size:12px;color:#718b85}
@media(max-width:760px){.wrap{padding:16px}.top{align-items:flex-start}.hero{padding:22px;display:block}.hero h1{font-size:25px}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.card{padding:16px}}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}.print{display:none}.hero{box-shadow:none}.card,.table-card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading">Loading partnership summary…</div></div>
<script>
(function(){
"use strict";
const url=new URL(location.href), venueId=url.searchParams.get("venue");
const supabase=supabaseLib();
function supabaseLib(){return window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{storageKey:"smv-master-crm-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}
const app=document.getElementById("app");
const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const d=v=>{if(!v)return "—";const x=new Date(v);return isNaN(x)?"—":x.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})};
const dt=v=>{if(!v)return "—";const x=new Date(v);return isNaN(x)?"—":x.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})};
const plan=v=>({launch_trial:"Launch Trial",partner:"Partner",growth:"Growth",premium:"Premium"})[v]||"Launch Trial";
const status=v=>String(v||"New").replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
function fail(title,msg){app.innerHTML='<div class="error"><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p></div>'}
async function load(){
 if(!venueId){fail("Venue not selected","Please open the partnership summary from the CRM.");return}
 const {data:sessionData}=await supabase.auth.getSession();
 if(!sessionData.session){fail("CRM session required","Please sign in to the Select My Venue CRM and open the venue summary again.");return}
 const {data:staff,error:staffError}=await supabase.rpc("smv_is_active_staff");
 if(staffError||staff!==true){fail("Access restricted","This partnership summary is available only to authorized Select My Venue staff.");return}
 const {data:venue,error:ve}=await supabase.from("venues").select("*").eq("id",venueId).single();
 if(ve||!venue){fail("Venue not found","The selected venue could not be loaded.");return}
 const {data:assignments,error:ae}=await supabase.from("venue_enquiry_assignments").select("id,enquiry_id,assignment_status,assigned_at,first_viewed_at,first_contacted_at,last_activity_at,site_visit_at,follow_up_at,converted_at,partner_note,created_at,customer_enquiries(id,customer_name,mobile,email,location,occasion,event_date,guests,status,created_at)").eq("venue_id",venueId).order("assigned_at",{ascending:false});
 if(ae){fail("Unable to load leads",ae.message);return}
 const rows=assignments||[];
 const active=rows.filter(x=>String(x.assignment_status||"").toLowerCase()!=="cancelled");
 const booked=active.filter(x=>["booked","converted"].includes(String(x.customer_enquiries?.status||"").toLowerCase())).length;
 const site=active.filter(x=>String(x.customer_enquiries?.status||"").toLowerCase()==="site-visit"||x.site_visit_at).length;
 const latest=active[0]?.assigned_at;
 app.innerHTML='<div class="top"><div class="brand"><div class="mark">SMV</div><div><b>Select My Venue</b><small>Venue Partnership</small></div></div><button class="print" onclick="window.print()">Print / Save PDF</button></div>'+
 '<section class="hero"><div><div class="kicker">VENUE PARTNERSHIP</div><h1>'+esc(venue.venue_name)+'</h1><p>'+esc([venue.area,venue.city].filter(Boolean).join(", ")||venue.address||"Venue partner")+'</p><div class="venue-meta"><span class="chip">'+esc(venue.venue_type||"Venue")+'</span><span class="chip">'+esc(venue.capacity_max?("Up to "+venue.capacity_max+" guests"):"Capacity on file")+'</span></div></div><div><div class="kicker">PARTNERSHIP STATUS</div><div style="font-size:18px;font-weight:900;margin-top:5px">'+esc(status(venue.plan_status||"active"))+'</div></div></section>'+
 '<div class="grid"><section class="card"><h2>Current Partnership</h2><div class="sub">Your current plan and validity with Select My Venue.</div><div class="plan"><div class="metric"><span>PLAN</span><strong>'+esc(plan(venue.partner_plan))+'</strong></div><div class="metric"><span>STATUS</span><strong>'+esc(status(venue.plan_status))+'</strong></div><div class="metric"><span>START DATE</span><strong>'+esc(d(venue.plan_started_at))+'</strong></div><div class="metric"><span>VALID UNTIL</span><strong>'+esc(d(venue.plan_expires_at))+'</strong></div></div></section>'+
 '<section class="card"><h2>Lead Performance</h2><div class="sub">Customer enquiries shared with this venue.</div><div class="kpis"><div class="kpi"><strong>'+active.length+'</strong><span>LEADS RECEIVED</span></div><div class="kpi"><strong>'+site+'</strong><span>SITE VISITS</span></div><div class="kpi"><strong>'+booked+'</strong><span>BOOKED / CONVERTED</span></div></div></section></div>'+
 '<section class="card table-card"><div class="table-head"><h2>Customer Enquiries Shared</h2><div class="sub" style="margin:5px 0 0">Only enquiries assigned to this venue are shown.</div></div><div class="table-wrap"><table class="table"><thead><tr><th>CUSTOMER</th><th>EVENT</th><th>EVENT DATE</th><th>GUESTS</th><th>LOCATION</th><th>STATUS</th><th>RECEIVED</th></tr></thead><tbody>'+
 (active.length?active.map(a=>{const e=a.customer_enquiries||{};return '<tr><td><strong>'+esc(e.customer_name||"Customer")+'</strong><br><span class="muted">'+esc(e.mobile||"Contact shared separately")+'</span></td><td>'+esc(e.occasion||"—")+'</td><td>'+esc(d(e.event_date))+'</td><td>'+esc(e.guests||"—")+'</td><td>'+esc(e.location||"—")+'</td><td><span class="status">'+esc(status(e.status||a.assignment_status))+'</span></td><td>'+esc(d(a.assigned_at||a.created_at))+'</td></tr>'}).join(""):'<tr><td colspan="7" class="empty">No customer enquiries have been assigned to this venue yet.</td></tr>')+
 '</tbody></table></div></section>'+
 '<div class="note"><strong>Select My Venue</strong> shares customer enquiries with verified venue partners based on customer requirements. This page shows only information relevant to this venue partnership.</div>';
}
load().catch(e=>fail("Unable to open summary","Please return to the CRM and try again."));
})();
</script>
</body>
</html>
